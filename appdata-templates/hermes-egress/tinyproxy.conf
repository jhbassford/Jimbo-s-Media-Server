# SOURCE OF TRUTH: this file (and ./filter in this same directory) is the
# checked-in copy of /volume1/docker/appdata/hermes-egress/tinyproxy.conf.
# On a rebuild, copy both files verbatim to that NAS path — do NOT replay
# the hermes-agent-nas Task 2 brief's Step 3 heredoc; it is missing the
# StartServers/MinSpareServers/MaxSpareServers/MaxRequestsPerChild block
# below, without which tinyproxy fails to start at all
# ("StartServers" must be greater than zero). See
# .superpowers/sdd/2026-09-09-hermes-agent-nas/task-2-report.md for why.
User nobody
Group nogroup
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 50
Allow 192.168.92.0/24
Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
FilterExtended On
FilterCaseSensitive Off
ConnectPort 443
DisableViaHeader Yes
StartServers 5
MinSpareServers 2
MaxSpareServers 10
MaxRequestsPerChild 0
