# Hermes agent configuration — spec §4.7 controls.
#
# SOURCE OF TRUTH: this file, in git.
# HOST PATH:       /volume1/docker/appdata/hermes-etc/config.yaml
# OWNER/MODE:      root:root 0644   (see appdata-templates/README.md)
# MOUNTED AS:      /opt/data/config.yaml  READ-ONLY
#
# It is deliberately NOT in /volume1/docker/appdata/hermes (the read-write
# /opt/data mount). Every control below is a containment guardrail; if the
# agent could rewrite them and then restart itself through the socket proxy,
# the guardrails would be advisory rather than enforced.
#
# CHANGING ANY VALUE HERE IS AN OPERATOR ACTION ON THE NAS HOST:
#   1. edit /volume1/docker/appdata/hermes-etc/config.yaml over SSH (as root)
#   2. restart the container
# There is no in-container write path: the bind mount is :ro, the container is
# read_only: true, and cap_drop: ALL removes CAP_DAC_OVERRIDE. That is the point.
#
# Secrets NEVER live here — they go in hermes.env (mounted at /opt/data/.env).
#
# KEY-NAME VERIFICATION STATUS (2026-09-09, against image digest a62824a4ec6f).
# A key the application silently ignores is a control that DOES NOT EXIST, so
# each one is tracked individually:
#
#   VERIFIED LIVE — the container was booted with this exact file mounted and
#   its own logs quote the values back:
#     model.default          -> "OpenRouter fallback model 'anthropic/claude-sonnet-5'"
#     dashboard.public_url   -> "a configured external public URL requires auth"
#     model.provider         -> "resolve_provider_client: openrouter requested"
#   VERIFIED PRESENT in the image's own generated example config:
#     terminal.backend
#     tool_loop_guardrails.non_interactive_hard_stop_enabled  (shipped default: true)
#     browser.extension_control.enabled                       (shipped default: false)
#   NOT YET VERIFIED — these come from the plan/spec, and no corresponding key
#   appears in the image's shipped example config. Plan Task 6 must confirm each
#   is actually read before this file is treated as an enforced boundary:
#     skills.auto_install
#     browser.enabled
#     dashboard.trusted_proxies
#     messaging.<channel>.allowed_users / reject_unknown
#
# ALSO DISCOVERED while verifying: the dashboard's auth provider is configured
# HERE, as `dashboard.basic_auth.username` + `dashboard.basic_auth.password_hash`
# (hash generated by the image's own plugins.dashboard_auth.basic.hash_password),
# NOT via the HERMES_DASHBOARD_BASIC_AUTH_* environment variables the plan's
# Task 6 assumes. The container currently fails CLOSED on this — it refuses to
# bind the dashboard to 0.0.0.0 with no auth provider registered — which is the
# correct behaviour, but it means Task 6 as written will not produce a working
# dashboard. Note that a password HASH in this file is not a secret in the way a
# bearer token is, so it belongs here rather than in hermes.env.

model:
  # Verified: resolve_provider_client resolves these (see container logs).
  default: "deepseek/deepseek-v4.1-flash"
  provider: "openrouter"

auxiliary:
  # free_only alone SKIPS the OpenRouter fallback entirely when the main model
  # is not a :free SKU, leaving auxiliary tasks (vision, compression, title
  # generation, and the approvals.mode: smart classifier) with NO backend at all.
  # Pairing it with a :free model is what the schema intends. Verified present in
  # the live OpenRouter catalogue, and it is the model Hermes own error names.
  openrouter_model: "nvidia/nemotron-3-ultra-550b-a55b:free"
  # Per-task aux blocks default to provider "auto", which INHERITS the main model
  # (sonnet-5) and is then rejected by free_only - which is why the aux lane was
  # dead even after setting openrouter_model. auxiliary_client does
  # or_model = model or cfg_model, so an explicitly-passed model wins over
  # openrouter_model. Pinning the blocks that matter is what actually engages it.
  approval:
    provider: "openrouter"
    model: "nvidia/nemotron-3-ultra-550b-a55b:free"
  compression:
    provider: "openrouter"
    model: "nvidia/nemotron-3-ultra-550b-a55b:free"
  title_generation:
    enabled: true
    provider: "openrouter"
    model: "nvidia/nemotron-3-ultra-550b-a55b:free"
  # VERIFIED KEY: agent/auxiliary_client.py reads cfg_get(cfg,"auxiliary","free_only").
  # Default is false, which means background/helper calls fall back to
  # google/gemini-3.6-flash (PAID) even though you never sent a message. true =
  # the OpenRouter step is skipped unless the model ends in ":free", so spend
  # tracks messages you deliberately send.
  free_only: true

terminal:
  # The `docker` backend is deliberately unused. Every hardening guide recommends
  # it, and we cannot use it: it sandboxes by CREATING containers, exactly the
  # privilege the restricted socket proxy refuses, and DSM's 4.4 kernel has no
  # rootless Docker. The compensating control is that THIS CONTAINER IS THE
  # SANDBOX (read_only, cap_drop ALL, no-new-privileges, egress via iptables).
  # Knowing deviation, recorded in the spec - not an oversight.
  backend: "local"

approvals:
  # VERIFIED SECTION (config_defaults.py:1520). The three *_mode defaults are
  # already "deny" - pinned here so a future image default-flip cannot silently
  # open them. unattended_mode is the one that matters most: it governs the
  # webhook/API surface, i.e. the messaging path.
  # manual, NOT smart. smart delegates the risk call to an auxiliary LLM, and on
  # this deployment the auxiliary lane had NO working backend (nous unauthenticated,
  # OpenRouter skipped by free_only) - so the classifier smart depends on was simply
  # absent, and its failure behaviour was not something I could establish from the
  # source in reasonable time. manual removes the dependency entirely: every flagged
  # command pauses for a human instead of asking a free model to adjudicate.
  # Dangerous commands should be rare; if this proves tedious, "smart" is a one-word
  # revert now that auxiliary has a working free backend below.
  mode: "manual"
  cron_mode: "deny"
  single_query_mode: "deny"
  unattended_mode: "deny"
  mcp_reload_confirm: true
  destructive_slash_confirm: true
  # Deny takes precedence over any allowlist. These are patterns, not a
  # substitute for the hardline blocklist (rm -rf /, fork bombs) which is always
  # enforced and cannot be overridden.
  deny:
    - "sudo *"
    - "rm -rf *"
    - "chmod 777*"
    - "chown -R root*"
    - "*curl*|*sh*"
    - "*wget*|*sh*"
    - "dd if=* of=/dev/*"
    - "docker *"
    - "git push --force*"

security:
  # VERIFIED SECTION (config_defaults.py:1589).
  #
  # allow_lazy_installs defaults to TRUE. That permits runtime package
  # installation, which is a supply-chain path that walks straight past the
  # Tinyproxy egress allowlist by pulling from registries we DO allow. This is
  # the single most valuable change in this file.
  allow_lazy_installs: false
  # Defaults, pinned so a future image cannot flip them silently.
  allow_private_urls: false
  redact_secrets: true
  protected_instruction_files: true
  # NOTE ON TIRITH: tirith_enabled defaults true, but `command -v tirith` returns
  # nothing in this image - pre-exec scanning is currently a NO-OP, enabled but
  # unavailable and failing open. Do NOT set tirith_fail_open: false to "fix"
  # this: with tirith absent, failing closed blocks ALL execution and bricks the
  # agent. Either install tirith, or do not count this layer. Left at defaults
  # deliberately, documented rather than pretended.
  tirith_enabled: true
  # Explicit path = authoritative. tirith_security.py never auto-downloads a
  # replacement for a non-default path, so this both engages the scanner AND
  # prevents Hermes installing a writable copy into /opt/data where the agent
  # could tamper with it. Binary is root:root 0555 on a :ro mount.
  tirith_path: "/opt/hermes-bin/tirith"
  # Now that the scanner actually EXISTS, fail closed. Previously this had to
  # stay true because tirith was absent and failing closed would have blocked
  # every command. Revert to true if the scanner proves flaky.
  tirith_fail_open: false
  # Defence in depth for the browser, which may not honour HTTP_PROXY the way
  # the Python HTTP stack does. The agent has no reason to browse this
  # household's own admin surfaces.
  website_blocklist:
    enabled: true
    domains:
      - "*.bassford.net"
      - "localhost"

skills:
  # VERIFIED SECTION (config_defaults.py:1324).
  # `skills.auto_install` DOES NOT EXIST and was removed from this file - the
  # only auto_install keys in the schema belong to secrets.bitwarden and proxy.
  # It was silently ignored. These are the real controls:
  #
  # inline_shell false = SKILL.md !`cmd` snippets are NOT pre-executed on the
  # host at load time. This is the nastiest thing in the section; it is the
  # default, pinned here.
  inline_shell: false
  # Agent-written skills are staged for /skills approve rather than taking
  # effect immediately. This is the real version of what auto_install: false
  # was meant to do.
  write_approval: true
  # Security-scan skills the agent writes. The schema is candid that this is
  # weak - "the agent can run the same code via terminal() ungated, so it mostly
  # blocks prose with risky keywords" - but it costs nothing.
  guard_agent_created: true
  # No scanning of project dirs for skills. Already gated by an empty
  # trusted_project_dirs; belt and braces.
  project_discovery: false
  trusted_project_dirs: []

browser:
  # `browser.enabled` DOES NOT EXIST and was removed - the schema has `backend`,
  # not `enabled`, so that line was silently ignored too. There appears to be no
  # clean "disable the browser entirely" switch; stating that plainly rather
  # than inventing a setting. allow_private_urls is the meaningful control: it
  # blocks the browser reaching localhost / 192.168.x.x, i.e. SSRF into the LAN.
  allow_private_urls: false
  auto_local_for_private_urls: false
  extension_control:
    enabled: false

tool_loop_guardrails:
  # Unattended gateways hard-stop by default; pinned.
  non_interactive_hard_stop_enabled: true
  warnings_enabled: true
  # Defaults are 50/50 PER TURN. On a 4-core J4125 that is a resource-exhaustion
  # event, not a guardrail.
  loop_caps:
    max_web_searches: 10
    max_subagents: 10

dashboard:
  public_url: "https://hermes.bassford.net"
  trusted_proxies:
    # Traefik on hermes_ingress (two-member net). Bounded - never 0.0.0.0/0.
    - "192.168.94.254"
  basic_auth:
    username: "jim"
    password_hash: "<PLACEHOLDER - see plan Task 6 Step 3b>"

# Messaging sender allowlists are ENVIRONMENT VARIABLES, not YAML. `hermes config
# check` lists TELEGRAM_ALLOWED_USERS / GATEWAY_ALLOWED_USERS / *_ALLOW_ALL_USERS.
# A `messaging:` block here would be silently ignored. They go in hermes.env,
# which is equally root-owned and read-only, so it is still a guardrail the agent
# cannot rewrite. Use GATEWAY_ALLOWED_USERS (cross-platform). NEVER set
# GATEWAY_ALLOW_ALL_USERS.
