########################### NETWORKS
networks:
  default:
    driver: bridge
  socket_proxy:
    name: socket_proxy
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.91.0/24
  t3_proxy:
    name: t3_proxy
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.90.0/24
  hermes_socket:
    name: hermes_socket
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.93.0/24
  hermes_net:
    name: hermes_net
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.92.0/24
  # Two-member network: Traefik + Hermes ONLY (review finding C1).
  # Hermes previously sat on t3_proxy, which the spec treated as ingress-only.
  # Docker bridges are bidirectional, so that also gave the agent direct reach to
  # Portainer (backed by the PERMISSIVE socket proxy = container create = root on
  # this NAS), an unauthenticated Dozzle, and every *arr API - all of them
  # bypassing Traefik and its basic-auth middleware entirely.
  hermes_ingress:
    name: hermes_ingress
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.94.0/24
  # Two-member network: hermes-google-egress + the Google MCP container ONLY
  # (Task 3). Source-IP-scoped so the proxy's ACL (Allow 192.168.95.0/24)
  # cannot be reached by Hermes itself on hermes_net. See compose/
  # hermes-google-egress.yml.
  hermes_google:
    name: hermes_google
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.95.0/24
  pihole_network:
    name: pihole_network
    external: true

########################### SECRETS
secrets:
  basic_auth_credentials:
    file: $DOCKERDIR/secrets/basic_auth_credentials
  cf_dns_api_token:
    file: $DOCKERDIR/secrets/cf_dns_api_token
  discord_redbot_token:
    file: $DOCKERDIR/secrets/discord_redbot_token
  # Moved out of container ENV (review finding C2). The Hermes agent is allowed
  # GET /containers/<id>/json through its restricted socket proxy, and Docker
  # returns Config.Env verbatim -- so any secret passed as an environment
  # variable is readable by a prompt-injected agent. The tunnel token is the
  # worst case: it is a WRITE credential that can republish tunnel ingress from
  # anywhere on the internet.
  cf_tunnel_token:
    file: $DOCKERDIR/secrets/cf_tunnel_token
  pihole_webpassword:
    file: $DOCKERDIR/secrets/pihole_webpassword

include:
  ########################### SERVICES
  # PREFIX udms = Ultimate Docker Media Server
  # HOSTNAME=udms - defined in .env

  # CORE
  - compose/$HOSTNAME/socket-proxy.yml
  - compose/$HOSTNAME/traefik.yml
  - compose/$HOSTNAME/portainer.yml
  - compose/$HOSTNAME/dozzle.yml
 # MEDIA
  - compose/$HOSTNAME/plex.yml
  - compose/$HOSTNAME/homeassistant.yml
 
 # SERVER MGMT
  - compose/$HOSTNAME/tautulli.yml
  - compose/watchtower.yml
 # MANAGERS
  - compose/$HOSTNAME/radarr.yml
  - compose/$HOSTNAME/sonarr.yml
  - compose/$HOSTNAME/bazarr.yml
  - compose/$HOSTNAME/seerr.yml
  - compose/$HOSTNAME/maintainerr.yml
 # DOWNLOADERS
  - compose/$HOSTNAME/sabnzbd.yml

 # AGENT
  - compose/hermes-socket-proxy.yml
  - compose/hermes-egress-proxy.yml
  - compose/hermes-google-egress.yml
  - compose/hermes-google-mcp.yml
  - compose/hermes.yml

 # THE REST
  - compose/redbot.yml
  - compose/cloudflared.yml
  - compose/pihole.yml
