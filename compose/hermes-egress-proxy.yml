services:
  # Domain-allowlisting forward proxy for Hermes. This is the ALLOWLIST;
  # the DOCKER-USER rules in Task 4 are the ENFORCEMENT. A library that
  # ignores HTTP_PROXY does not get out — it just fails.
  #
  # Deviations from the brief's literal YAML, all forced by empirical
  # failures on this NAS's kernel/docker combo (DSM 4.4.302, no cgroup v2) —
  # see task-2-report.md "Deviations" section for the full investigation:
  #
  #   1. `command: ANY` is replaced by a direct `entrypoint:` invocation of
  #      /usr/bin/tinyproxy. The image's default entrypoint
  #      (/opt/docker-tinyproxy/run.sh) unconditionally `sed -i`-edits
  #      /etc/tinyproxy/tinyproxy.conf to inject the ACL argument — which
  #      fails outright ("Read-only file system") because that file is
  #      bind-mounted `:ro`. Our tinyproxy.conf already hardcodes
  #      `Allow 192.168.92.0/24` and every Filter* directive directly, so
  #      the script's sed-editing is unnecessary; invoking the binary
  #      directly with `-d` (foreground) `-c` (our conf) bypasses it
  #      entirely while leaving the conf/filter mounts genuinely read-only —
  #      the property that matters: even a compromised tinyproxy process
  #      cannot rewrite its own allowlist. One side effect: because run.sh's
  #      setAccess() never runs, the `Allow 192.168.92.0/24` line in our
  #      hand-written conf stays live (it's normally commented out when
  #      `command: ANY` runs via run.sh). This is a client-source-IP ACL on
  #      top of the domain filter — tightening, not loosening — but it means
  #      only clients whose source address is inside hermes_net's /24 can
  #      use the proxy at all, which is what we want anyway since only
  #      Hermes will ever be attached to this network.
  #   2. `user: "65534:65533"` (nobody:nogroup numeric IDs) is added. With
  #      `cap_drop: ALL`, the container never has CAP_SETUID/CAP_SETGID, so
  #      tinyproxy's own root->nobody privilege drop (driven by the
  #      `User nobody` / `Group nogroup` lines in tinyproxy.conf) fails
  #      ("Unable to change to group 'nogroup'"). Starting the process
  #      already-unprivileged sidesteps the drop entirely (tinyproxy logs
  #      "Not running as root, so not changing UID/GID" and continues
  #      normally) without adding any capability back — better than
  #      restoring SETUID/SETGID to a cap_drop:ALL container, since this
  #      needs zero capabilities restored.
  #   3. `tmpfs: [/tmp]` is added (kept alongside `read_only: true`, NOT a
  #      replacement for it). Root-caused with strace: tinyproxy's
  #      shared-memory allocator for its child-process bookkeeping does NOT
  #      use true anonymous MAP_ANONYMOUS|MAP_SHARED on this Alpine 3.10
  #      build — it opens a real file under /tmp
  #      (`open("/tmp/tinyproxy.shared.XXXXXX", O_RDWR|O_CREAT|O_EXCL, 0600)`,
  #      then immediately mmaps MAP_SHARED and unlinks it — the classic
  #      "unlinked tempfile as anonymous shared memory" portability trick).
  #      With `read_only: true` and no writable /tmp, that open() fails with
  #      EROFS, which surfaces as "Could not allocate memory for child
  #      counting." A `/tmp` tmpfs is sufficient and was confirmed
  #      sufficient in isolation — `read_only: true` is otherwise fully
  #      intact, plus every other hardening control (cap_drop: ALL,
  #      no-new-privileges, ro mounts on both config files, no ports:).
  #
  # NAS-side `tinyproxy.conf` also needs 4 lines beyond what the brief's
  # Step 3 heredoc specifies (StartServers/MinSpareServers/MaxSpareServers/
  # MaxRequestsPerChild — thread-pool sizing, not security-relevant; without
  # them tinyproxy fails to start at all with `"StartServers" must be
  # greater than zero`). The complete, corrected file contents are checked
  # into this repo at appdata-templates/hermes-egress/ as the source of
  # truth — copy them to $DOCKERDIR/appdata/hermes-egress/ on any rebuild,
  # do not replay the brief's Step 3 heredoc verbatim.
  hermes-egress-proxy:
    # Pinned by digest, resolved 2026-09-09 on the NAS from the already-pulled
    # monokal/tinyproxy:latest (image id sha256:bce423180120, Created
    # 2020-08-03T13:55:42Z). This was the only unpinned image in the Hermes set,
    # and it sits ON the egress security boundary in a design whose stated
    # principle is digest pinning — a silently-swapped :latest here would be a
    # silently-swapped allowlist enforcer.
    # CAVEAT: this image's base is Alpine 3.10, EOL since 2021, and the image
    # itself has not been rebuilt since 2020. Pinning freezes it rather than
    # fixing it; a maintained replacement (or a small self-built tinyproxy image)
    # is worth doing before this deployment is considered finished.
    image: monokal/tinyproxy@sha256:2c1b6f187fe18a993ec6e88cdb12c8f1d28d7416bd73492289aa5f74f687c672
    container_name: hermes-egress-proxy
    restart: unless-stopped
    user: "65534:65533"
    entrypoint: ["/usr/bin/tinyproxy", "-d", "-c", "/etc/tinyproxy/tinyproxy.conf"]
    mem_limit: 64M
    read_only: true
    tmpfs:
      # Options match compose/hermes.yml's /tmp. tinyproxy only ever open()s,
      # mmap()s and unlink()s a single temp file here (confirmed by strace — see
      # deviation 3 above), so it never execs from /tmp and noexec costs nothing
      # functionally while closing a write-a-binary-then-exec path inside the
      # container that is the agent's sole egress point. size=16m also caps a
      # mild DoS lever: there is no cgroup v2 on this NAS, so tmpfs pages are not
      # reliably accounted against mem_limit: 64M.
      - /tmp:noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - $DOCKERDIR/appdata/hermes-egress/tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf:ro
      - $DOCKERDIR/appdata/hermes-egress/filter:/etc/tinyproxy/filter:ro
    networks:
      hermes_net:
        ipv4_address: 192.168.92.2
