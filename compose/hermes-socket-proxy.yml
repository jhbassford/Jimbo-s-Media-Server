services:
  # Restricted Docker socket proxy for Hermes: read + restart ONLY.
  # Deliberately separate from the stack's tecnativa socket-proxy, which
  # filters by path prefix only and cannot express "restart but not delete".
  hermes-socket-proxy:
    image: wollomatic/socket-proxy:1.13.1
    container_name: hermes-socket-proxy
    restart: unless-stopped
    user: "65534:0"            # nobody; gid 0 required to read docker.sock (root:root 660)
    mem_limit: 64M
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - '-loglevel=info'
      - '-listenip=0.0.0.0'
      - '-allowfrom=192.168.93.0/24'
      # Read surface. Patterns are anchored automatically (^...$).
      # Trailing wildcards are confined to "(\?.*)?" (an optional query string)
      # rather than a bare ".*", so they cannot match across a "/" and admit a
      # traversal-shaped path such as ".../logs/../../images/json".
      - '-allowGET=/(v1\.[0-9]{1,2}/)?version'
      - '-allowGET=/(v1\.[0-9]{1,2}/)?info'
      - '-allowGET=/(v1\.[0-9]{1,2}/)?containers/json(\?.*)?'
      - '-allowGET=/(v1\.[0-9]{1,2}/)?containers/[a-zA-Z0-9_.-]+/json'
      - '-allowGET=/(v1\.[0-9]{1,2}/)?containers/[a-zA-Z0-9_.-]+/logs(\?.*)?'
      - '-allowGET=/(v1\.[0-9]{1,2}/)?containers/[a-zA-Z0-9_.-]+/stats(\?.*)?'
      # The ONLY mutation permitted, and it is scoped to an EXPLICIT ALLOWLIST of
      # container names rather than a name wildcard. A wildcard here
      # ([a-zA-Z0-9_.-]+) covers every container on the box, which means a
      # prompt-injected agent could restart:
      #   hermes                — itself, reloading any config it had rewritten
      #   hermes-egress-proxy   — its own egress allowlist
      #   hermes-socket-proxy   — this proxy
      #   pihole                — DNS for the entire household
      #   traefik / cloudflared — all ingress and all remote access
      #   watchtower            — the updater
      #   socket-proxy          — the PERMISSIVE proxy serving portainer/dozzle
      # None of those are "ops assistant" actions; all of them are denial of
      # service or containment escapes. The alternation below is exactly the set
      # the ops role needs (spec §1 role 2: "read + restart containers"), and
      # nothing else. Adding a name here is a deliberate, reviewable act.
      #
      # `hermes-restart-canary` is the disposable alpine container that
      # docs/superpowers/verify/hermes-socket-proxy.sh creates through the
      # PERMISSIVE proxy purely to prove POST restart genuinely returns 204. It
      # is listed here on purpose. The alternative was to restart a live service
      # (plex/pihole/an *arr) on every verification run, which is unacceptable on
      # a NAS the household depends on. Granting it costs nothing: this proxy
      # cannot create containers, cannot rename them (no POST .../rename), and no
      # container by that name exists outside a verification run — so for a
      # hijacked agent the name resolves to 404, not to a capability.
      #
      # "(\?.*)?" admits a legitimate stop-timeout query (e.g. "?t=5") without
      # opening up any other path.
      - '-allowPOST=/(v1\.[0-9]{1,2}/)?containers/(plex|radarr|sonarr|bazarr|sabnzbd|seerr|tautulli|maintainerr|hermes-restart-canary)/restart(\?.*)?'
      # DELETE is intentionally not configured at all (no -allowDELETE flag) —
      # this states exactly and only what is permitted. wollomatic/socket-proxy
      # returns 405 for a method with no -allow flag at all (rejected by the
      # router before path-matching) rather than 403 (rejected by path-matching
      # on a configured method) — both are conclusive denials; the verification
      # script accepts either.
      - '-watchdoginterval=3600'
      - '-stoponwatchdog'
    # No ports: — reachable only from the hermes_socket network.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      hermes_socket:
        ipv4_address: 192.168.93.2
