services:
  # Hermes agent gateway. THIS CONTAINER IS THE SANDBOX — DSM 4.4.302 has no
  # cgroup v2 and no rootless docker, so there is no nested sandbox available;
  # every hardening control below is the real boundary between a
  # prompt-injected agent and the NAS, not defense-in-depth on top of one.
  #
  # Reachable ONLY as http://hermes:9119 from t3_proxy (Traefik) — no ports:
  # published, not even loopback. Its only two other network paths are the
  # RESTRICTED docker-socket proxy (hermes_socket, Task 1: read + restart
  # only) and the domain-allowlisting egress proxy (hermes_net, Task 2:
  # default-deny, CONNECT restricted to :443). It is never attached to
  # socket_proxy (the permissive proxy serving traefik/portainer/dozzle).
  #
  # HERMES_ALLOW_ROOT_GATEWAY is deliberately UNSET — do not add it.
  # No com.centurylinklabs.watchtower.enable label — deliberate, no
  # auto-update; the image is pinned by digest below and bumped by hand.
  # Dashboard auth credentials are NOT set here — they are secrets, added in
  # Task 6 via the NAS-side .env, which push.sh does not sync. Until then
  # this container boots and idles waiting for configuration; that is
  # expected, not a defect.
  #
  # Deviations from the brief's literal YAML, all forced by this exact
  # pinned image's s6-overlay v3 bootstrap and this NAS's cgroup-v1-only
  # kernel, verified with `docker logs` / source inspection of
  # /opt/hermes/docker/stage2-hook.sh / direct `docker inspect` readback —
  # not guessed. See task-3-report.md for the full investigation.
  #
  #   1. `cpus: 2.0` is dropped. This DSM kernel has NO CFS bandwidth control
  #      at all (`docker info` on the host prints "WARNING: No cpu cfs quota
  #      support" / "WARNING: No cpu cfs period support"; `/proc/cgroups` on
  #      the host has no working cpu.cfs_period/quota). Setting `cpus:` maps
  #      to `--cpus`/NanoCPUs, which needs exactly that kernel feature;
  #      `docker compose up` refuses outright with "NanoCPUs can not be set,
  #      as your kernel does not support CPU CFS scheduler or the cgroup is
  #      not mounted" before the container is even created. Not a writable
  #      path issue — no tmpfs/bind-mount fixes a kernel that lacks a
  #      scheduler feature.
  #      COMPENSATING CONTROL: `cpu_shares: 512` below. The `cpu` cgroup v1
  #      subsystem IS mounted on this host (`cpu.shares` comes from
  #      CONFIG_FAIR_GROUP_SCHED, a different kernel config symbol than the
  #      CFS-bandwidth one that's missing) — confirmed live:
  #      `cat /sys/fs/cgroup/cpu/cpu.shares` inside a test container reads
  #      back `512`. This does NOT cap absolute CPU (no substitute for
  #      `cpus:` — an idle host still lets Hermes use all 4 cores), but it
  #      is the difference between Hermes losing the scheduler fight under
  #      contention vs. being able to starve Plex/Traefik/the *arr stack.
  #
  #   2. `pids_limit: 512` is KEPT (documents intent, brief-literal) but is
  #      NOT enforced: `docker compose up` prints "Your kernel does not
  #      support PIDs limit capabilities or the cgroup is not mounted. PIDs
  #      limit discarded.", and `docker inspect`'s `HostConfig.PidsLimit`
  #      reads back `<nil>`. Root cause: `/proc/cgroups` on the host has no
  #      `pids` line at all — CONFIG_CGROUP_PIDS was never built into this
  #      kernel. Same category as #1: an absent kernel subsystem, not a
  #      missing mount.
  #      COMPENSATING CONTROL: `ulimits: nproc` below. RLIMIT_NPROC is a
  #      POSIX rlimit enforced in the kernel's copy_process() with NO cgroup
  #      dependency at all — confirmed live via `docker exec ... cat
  #      /proc/self/limits` showing "Max processes 1024 1024" genuinely
  #      applied. It is effective here specifically because the usual
  #      escape hatches are closed: RLIMIT_NPROC is not enforced for UID 0
  #      (irrelevant — Hermes never runs as root) and raising your own hard
  #      limit needs CAP_SYS_RESOURCE, which cap_drop: ALL removes and
  #      no-new-privileges:true keeps removed.
  #      CAVEAT: RLIMIT_NPROC counts processes per real UID SYSTEM-WIDE, not
  #      per-container. Checked on this host: the rest of the stack
  #      (radarr/sonarr/sabnzbd/bazarr/tautulli) runs as PUID=$PUID, which
  #      resolves to 1026 on this NAS's .env — a DIFFERENT UID from
  #      Hermes's 1000 — and no other container on this host is pinned to
  #      UID 1000 (`docker inspect --format '{{.Config.User}}'` checked
  #      across every running container). So today this ceiling is
  #      exclusive to Hermes, not shared — 1024 is chosen generously anyway
  #      in case that ever changes, not because it's currently contended.
  #      `ulimits: nofile: 4096` is added alongside it for the same
  #      cgroup-free-enforcement reason, sized to the LinuxServer.io-style
  #      defaults used elsewhere in this stack.
  #
  #   3. `memswap_limit: 4g` is added next to `mem_limit: 4g` — without it
  #      Docker defaults memory-swap to 2x memory, silently doubling the
  #      real budget to 4 GB RAM + 4 GB swap. Confirmed via `docker inspect`
  #      that both `Memory` and `MemorySwap` read back identically as
  #      4294967296 (i.e. zero swap headroom beyond the RAM limit). No
  #      "kernel does not support swap limit" warning was printed on this
  #      host (unlike #1/#2) — this kernel's memory cgroup does carry swap
  #      accounting.
  #
  #   4. `/run` is a tmpfs with the explicit `exec` mount option (see the
  #      volumes/tmpfs entries below), NOT the default Docker tmpfs
  #      behaviour. s6-overlay v3 (this image's PID 1) execs a binary it
  #      places at /run/s6/basedir/bin/init during boot. Docker PREPENDS
  #      noexec,nosuid,nodev to every tmpfs mount and appends user-supplied
  #      options after; `exec` in the user options is what explicitly
  #      clears the MS_NOEXEC flag runc's mount-option parser applied —
  #      merely omitting `noexec` does nothing (that was tried first and
  #      failed identically both times: `--tmpfs /run:nosuid,nodev,...` and
  #      `--mount type=tmpfs,destination=/run,...` both still showed
  #      `noexec` in `mount` inside the container). With `exec` present,
  #      `mount` shows `rw,nosuid,nodev,relatime` (no noexec) and the same
  #      script that previously failed with "Permission denied" executing
  #      /run/s6/basedir/bin/init now runs cleanly — confirmed with a full
  #      boot to a stable, s6-supervised, non-crash-looping container.
  #      Because this is genuinely tmpfs (not a bind mount), /run is wiped
  #      on every container start/restart/recreation — no attacker-planted
  #      payload at /run/s6/basedir/... (which execs at PID-1 trust level,
  #      as the same UID 1000 an attacker inside the container would hold)
  #      can survive past the current boot. An earlier version of this file
  #      used a host bind mount here instead (a persistent
  #      $DOCKERDIR/appdata/hermes-run directory) because two earlier tests
  #      of tmpfs for /run both omitted the `exec` option and were
  #      incorrectly read as proving tmpfs categorically couldn't work here
  #      — that state path has been removed; it is no longer part of this
  #      deployment.
  #
  #   5. `user: "1000:10"` itself only works because /etc/passwd + /etc/group
  #      are read-only bind mounts of edited copies of the image's own
  #      files (checked in at appdata-templates/hermes/passwd and
  #      .../group). This image's stage2-hook.sh rejects any `--user` UID
  #      that isn't `0` or its baked-in `hermes` account's UID (10000 in
  #      this pinned digest) as "arbitrary" and refuses to start; its
  #      documented alternative (root + PUID/PGID + internal usermod +
  #      s6-setuidgid drop) independently needs CAP_SETUID/CAP_SETGID, which
  #      cap_drop: ALL removes. Pre-editing the `hermes` line in these two
  #      files from `10000:10000` to `1000:10` (every other line
  #      byte-identical to the image's originals) means the container
  #      starts already at 1000:10 with no privilege transition of any kind
  #      ever attempted — verified via `docker exec hermes ps aux`: every
  #      process, including the actual gateway, runs as `hermes`
  #      (uid=1000, gid=10). Both files must be present and correctly owned
  #      for this to work — see the ownership/mode notes on the volume
  #      lines below. `appdata-templates/hermes/group` deliberately does
  #      NOT add its own `hermes:x:10:` line — GID 10 already resolves to
  #      `uucp` in the image's own /etc/group (both the passwd file's GID
  #      field and this file's existing `uucp:x:10:` line are sufficient;
  #      an earlier version of this file added a second, duplicate `10:`
  #      line, which made `id -gn hermes` / `chown hermes:hermes` a
  #      coin-flip between "hermes" and "uucp" depending on glibc's NSS
  #      lookup order — removed).
  hermes:
    # Pinned by digest, resolved 2026-09-09 from nousresearch/hermes-agent:latest
    # (image id sha256:35df7f00847f, org.opencontainers.image.revision
    # bbf91b76506d8d0a757fa7217341980b3b2789f0, Created 2026-09-09T11:33:32Z —
    # no semver label exists upstream, so the git revision above is the only
    # human-readable version marker tied to this digest). Never substitute
    # :latest here.
    image: nousresearch/hermes-agent@sha256:a62824a4ec6fed789346a2019907143b56aa6191d6564519fe62aa1bdc1ebd61
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    user: "1000:10"
    read_only: true
    tmpfs:
      # /tmp: general scratch space; s6-overlay never execs anything from
      # here (only from /run — see deviation 4 above), so noexec costs
      # nothing functionally. noexec,nosuid,nodev + a size cap: this
      # container is the sandbox boundary, so a writable+executable tmpfs
      # would be a write-a-binary-then-exec path for a prompt-injected agent.
      - /tmp:noexec,nosuid,nodev,size=64m
      # /run: s6-overlay (PID 1) execs its own generated init binary from
      # here — the `exec` option is required (see deviation 4 above) and is
      # a deliberate, narrowly-scoped exception to the noexec-everywhere
      # policy: it applies ONLY to s6's own supervision-tree scratch files,
      # which are wiped fresh on every container start/restart (tmpfs, not
      # a bind mount), so nothing an attacker writes here survives past the
      # current boot.
      - /run:exec,nosuid,nodev,size=16m,mode=0755,uid=1000,gid=10
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    memswap_limit: 4g   # pins memory+swap together; without this Docker defaults swap to 2x memory (see deviation 3 above)
    cpu_shares: 512      # compensating control for the missing cpus: cap — see deviation 1 above
    ulimits:
      nproc: 1024        # compensating control for the missing pids_limit enforcement — see deviation 2 above
      nofile: 4096
    # cpus: 2.0 omitted — see deviation 1 above (no CFS bandwidth control on
    # this kernel at all; docker refuses to create the container with it set).
    pids_limit: 512   # requested; NOT enforced on this kernel — see deviation 2 above; compensated by ulimits.nproc.
    # NO ports: — reachable only via Traefik on t3_proxy, and Traefik itself
    # only proxies to http://hermes:9119 over the docker network.
    volumes:
      - $DOCKERDIR/appdata/hermes:/opt/data
      - /volume1/code:/opt/code
      # $DOCKERDIR/appdata/hermes-etc/{passwd,group}: edited copies of the
      # image's own /etc/passwd + /etc/group (hermes remapped 10000:10000
      # -> 1000:10; see deviation 5 above). REQUIRED ownership/mode on the
      # host: root:root, 0644 — if either file is missing on a rebuild,
      # Docker auto-creates a root-owned regular file/directory at that
      # path instead of bind-mounting, which would silently break the
      # `--user 1000:10` accept-check above (fails closed: the container
      # would then hit the "arbitrary, non-hermes UID" rejection again, not
      # a security hole, but a startup failure). Source of truth in git:
      # appdata-templates/hermes/{passwd,group} — copy both to
      # $DOCKERDIR/appdata/hermes-etc/ verbatim on any rebuild.
      - $DOCKERDIR/appdata/hermes-etc/passwd:/etc/passwd:ro
      - $DOCKERDIR/appdata/hermes-etc/group:/etc/group:ro
    environment:
      PUID: 1000
      PGID: 10
      TZ: $TZ
      HERMES_DASHBOARD: 1
      HERMES_DASHBOARD_HOST: 0.0.0.0        # container-internal only; no host port is published
      HERMES_DASHBOARD_PORT: 9119
      HTTP_PROXY: http://192.168.92.2:8888
      HTTPS_PROXY: http://192.168.92.2:8888
      NO_PROXY: 192.168.90.0/24,192.168.92.0/24,192.168.93.0/24,localhost,127.0.0.1
      DOCKER_HOST: tcp://192.168.93.2:2375
    networks:
      t3_proxy:
        ipv4_address: 192.168.90.10
      hermes_net:
        ipv4_address: 192.168.92.10
      hermes_socket:
        ipv4_address: 192.168.93.10
