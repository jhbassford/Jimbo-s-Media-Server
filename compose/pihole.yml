services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    networks:
      pihole_network:
        ipv4_address: 192.168.1.105 # Pi-hole's static IP
    environment:
      - TZ=Australia/Sydney
      # Pi-hole v6 resolves this as a SECRET NAME, not a path: bash_functions.sh
      # reads /run/secrets/${WEBPASSWORD_FILE}. Keeps the password out of
      # container env, which the agent can read via docker inspect (finding C2).
      - WEBPASSWORD_FILE=pihole_webpassword
      - DNS1=1.1.1.1   # Upstream DNS (Cloudflare)
      - DNS2=1.0.0.1
    volumes:
      - '$DOCKERDIR/pihole/etc-pihole:/etc/pihole'
      - '$DOCKERDIR/pihole/etc-dnsmasq.d:/etc/dnsmasq.d'
    secrets:
      - pihole_webpassword
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

